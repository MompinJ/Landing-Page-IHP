<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!--
      VIEWPORT DE JUEGO, no de página. Cada trozo arregla algo que en un
      teléfono se nota jugando:

        viewport-fit=cover  el lienzo llega hasta el borde físico y pasa por
                            debajo de la muesca y de la barra de gestos; lo que
                            no puede quedar ahí debajo lo aparta el CSS con
                            `env(safe-area-inset-*)` (ver index.css).
        maximum-scale=1     un doble toque rápido para saltar dos casillas es
                            justo el gesto con el que Safari hace zoom. Sin
                            esto, el tablero se ampliaba a media partida.
        user-scalable=no    lo mismo con el pellizco: en una pantalla táctil el
                            pulgar se apoya y el juego se iba de escala.

      Se desactiva el zoom a sabiendas de que en una página normal eso es un
      problema de accesibilidad: aquí el contenido no es texto que haya que
      ampliar sino un tablero que tiene que caber entero, y ampliarlo esconde
      justo lo que hay que ver para esquivar. Los textos de la interfaz crecen
      solos con el tamaño de pantalla (`clamp`) en vez de pedir zoom.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <!-- Barra del navegador del color del juego: sin esto queda una franja
         blanca sobre un juego nocturno, que es lo primero que se ve al abrirlo -->
    <meta name="theme-color" content="#061a2e" />
    <!-- Añadido a la pantalla de inicio, arranca a pantalla completa -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Port Quest — Hutchison Ports</title>
    <script type="module" crossorigin src="./assets/index-XgBRh_cW.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-LS5fsORQ.css">
  </head>
  <body>
    <div id="root"></div>

    <!--
      AVISO DE ARRANQUE — la única red que cubre el caso de que el juego NO
      LLEGUE A EJECUTARSE.

      Fue el fallo real: el paquete salía compilado para iOS 16.4 y un teléfono
      más viejo no podía ni leerlo. Un error de SINTAXIS no lanza una excepción
      que se pueda capturar desde React ni desde ningún sitio del propio
      paquete — el navegador descarta el fichero entero antes de ejecutar la
      primera línea. Así que el aviso tiene que estar FUERA, aquí, en el HTML.

      Va en ES5 puro y sin dependencias a propósito: es lo último que queda en
      pie cuando falla todo lo demás, así que no puede necesitar nada.

      Se quita solo en cuanto React monta (`main.tsx`).
    -->
    <div id="arranque" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:28px;text-align:center;background:#061a2e;color:#eaf2fb;font:16px/1.5 'Segoe UI',system-ui,-apple-system,sans-serif">
      <span style="font-size:12px;letter-spacing:.26em;color:#3fa9f5">PORT QUEST</span>
      <span id="arranque-txt" style="font-size:15px;color:#8fb2d0">Cargando…</span>
      <noscript>
        <span style="font-size:15px;color:#8fb2d0">Este juego necesita JavaScript activado.</span>
      </noscript>
    </div>

    <script>
      (function () {
        var listo = false;
        window.__portQuestArrancado = function () {
          listo = true;
          var el = document.getElementById('arranque');
          if (el && el.parentNode) el.parentNode.removeChild(el);
        };

        function avisar(detalle) {
          if (listo) return;
          var txt = document.getElementById('arranque-txt');
          if (!txt) return;
          txt.innerHTML =
            '<b style="display:block;font-size:20px;font-style:italic;text-transform:uppercase;color:#eaf2fb;margin-bottom:10px">No se pudo cargar el juego</b>' +
            'Suele arreglarse actualizando el navegador (en iPhone, iOS 15 o posterior) ' +
            'o abriéndolo en Chrome o Safari en vez de dentro de otra aplicación.' +
            (detalle ? '<span style="display:block;margin-top:12px;font-size:11px;opacity:.55">' + detalle + '</span>' : '');
        }

        // Un error de sintaxis en el paquete llega por aquí, no por try/catch.
        window.addEventListener('error', function (e) {
          avisar(e && e.message ? String(e.message).slice(0, 120) : '');
        });
        // ...y si lo que falla es la DESCARGA, no hay evento de error del
        // paquete que valga: solo el reloj. Veinte segundos porque el paquete
        // pesa metro y medio y en el 3G de un centro de convenciones eso tarda.
        setTimeout(function () { avisar(''); }, 20000);
      })();
    </script>

  </body>
</html>
